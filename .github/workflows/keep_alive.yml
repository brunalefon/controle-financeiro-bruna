name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *' # roda todo dia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl '${{ secrets.SUPABASE_URL }}/rest/v1/faturas?select=*&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}"
